<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNP講座 Q&A集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF4FB;
    --surface: #FFFFFF;
    --border: #D7E4F2;
    --border-strong: #B7CEE6;
    --navy: #0F3D6B;
    --blue: #1E63B0;
    --blue-light: #E7F0FB;
    --blue-mid: #CFE2F7;
    --text-primary: #16283A;
    --text-secondary: #52708C;
    --text-muted: #8AA3B8;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15,61,107,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(1200px 400px at 50% -120px, #DCEBFA 0%, transparent 60%),
      var(--bg);
    color:var(--text-primary);
    min-height:100vh;
    padding-bottom:48px;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}

  header{
    padding:28px 16px 18px;
    text-align:center;
  }
  header .kicker{
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--blue);
    font-weight:700;
    margin:0 0 6px;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 8px;
    line-height:1.4;
  }
  header p{
    font-size:13px;
    color:var(--text-secondary);
    margin:0;
    line-height:1.6;
  }

  .tabs{
    display:flex;
    gap:8px;
    position:sticky;
    top:0;
    z-index:5;
    padding:12px 16px 10px;
    background:linear-gradient(var(--bg) 78%, transparent);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:11px 4px;
    border-radius:12px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text-secondary);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
    user-select:none;
  }
  .tab .count{
    display:block;
    font-size:11px;
    font-weight:500;
    margin-top:2px;
    color:var(--text-muted);
  }
  .tab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  .tab.active .count{ color:#BBD6F2; }
  .tab:active{ transform:scale(0.97); }

  .list{ padding:6px 16px 0; display:flex; flex-direction:column; gap:10px; }

  .item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .q-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:16px 16px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .q-num{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--blue-light);
    color:var(--blue);
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .q-text{
    flex:1;
    font-size:15px;
    font-weight:500;
    line-height:1.55;
    color:var(--text-primary);
    padding-top:4px;
  }
  .chevron{
    flex:0 0 auto;
    width:20px;
    height:20px;
    margin-top:8px;
    color:var(--text-muted);
    transition:transform .2s ease;
  }
  .item.open .chevron{ transform:rotate(180deg); color:var(--blue); }

  .a-wrap{
    max-height:0;
    overflow:hidden;
    transition:max-height .28s ease;
  }
  .item.open .a-wrap{ }
  .a-inner{
    padding:0 16px 18px 58px;
    font-size:14px;
    line-height:1.75;
    color:var(--text-secondary);
    border-top:1px dashed var(--border-strong);
    margin-top:0;
    padding-top:12px;
  }
  .a-label{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--blue);
    padding:2px 8px;
    border-radius:6px;
    margin-bottom:8px;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding:28px 20px 0;
    line-height:1.7;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B1A2A;
      --surface:#122236;
      --border:#1E3852;
      --border-strong:#2A4A6A;
      --navy:#7FB4EA;
      --blue:#5FA0E0;
      --blue-light:#173049;
      --blue-mid:#1C3C5A;
      --text-primary:#EAF2FA;
      --text-secondary:#9FB8CE;
      --text-muted:#6E8CA4;
    }
    body{ background: radial-gradient(1200px 400px at 50% -120px, #16324D 0%, transparent 60%), var(--bg); }
    .tab.active{ color:#0B1A2A; }
    .tab.active .count{ color:#0B1A2A; opacity:.7; }
    .a-label{ color:#0B1A2A; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="kicker">MNP講座ノウハウ</p>
    <h1>Q&amp;A集</h1>
    <p>タップして答えを表示 ／ 全100問</p>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>

  <footer>
    ※維持期間・審査基準は店舗や時期で変わります。<br>実践前に最新の案件詳細・公式情報を必ずご確認ください。
  </footer>
</div>

<script>
const DATA = {"初級": [{"n": "1", "q": "「MNP」とは何の略？", "a": "Mobile Number Portability（携帯電話番号ポータビリティ）の略。番号を変えずに他社キャリアへ乗り換える仕組み。"}, {"n": "2", "q": "「CB」とは？", "a": "キャッシュバックの略。MNP・新規契約時にキャリアや代理店から現金・ポイント・商品券などで還元される特典のこと。"}, {"n": "3", "q": "「弾（たま）」とは何のこと？", "a": "MNPの乗り換え元として使う回線のこと。ポケットSIMや格安SIMなどを新規契約し、それを別キャリアへ乗り換える際の「発射台」にする。"}, {"n": "4", "q": "「手配師」とは？", "a": "量販店やショップの好条件案件（CB増額施策など）を見つけて実践者を案内・同行してくれる人のこと。手配料を払って利用する。"}, {"n": "5", "q": "「アテナ手配」「手配のアテナ」とは？", "a": "講座内で案内されている信頼できる手配師（案件案内）の一つ。案件番号（015、087など）で管理されている。"}, {"n": "6", "q": "量販店とショップ（キャリア直営店）の違いは？", "a": "量販店（ヤマダ・ノジマ・エディオンなど）は家電値引きやポイント還元が中心、ショップ（案件経由）は現金CBが出やすいなど施策の傾向が異なる。"}, {"n": "7", "q": "「利用者登録」とは？", "a": "契約者本人以外の人（家族など）をその回線の実際の使用者として登録する手続き。本人確認書類などが必要。"}, {"n": "8", "q": "家族の利用者登録に委任状は使える？", "a": "ドコモは委任状での家族契約が可能。ただし他社も含めキャリアごとにルールが異なるため要確認。"}, {"n": "9", "q": "未成年でも回線契約はできる？", "a": "「契約者（名義人）」になれるのは大手キャリア原則12歳以上。0歳や5歳から可能なのは「利用者登録（使用者登録）」の話で、契約者にはなれない点に注意（キャリアにより緩和されるケースもある）。"}, {"n": "10", "q": "「維持期間」とは？", "a": "MNP後、その回線を解約せず持ち続ける必要がある期間の目安。短期解約するとブラック（総合NG）のリスクが上がる。"}, {"n": "11", "q": "91日・181日・211日など数字の違いは何？", "a": "量販店契約は91日、ショップ・ブラック回避重視なら181日や211日など、キャリアや案件によって推奨される維持期間が異なる。"}, {"n": "12", "q": "「ブラック（総合NG）」とは？", "a": "短期解約や過度な契約の繰り返しなどが原因で、そのキャリアで新規・MNP契約の審査に通らなくなる状態のこと。"}, {"n": "13", "q": "ブラックになったらどのくらいで解消される？", "a": "目安として1年程度と言われることが多いが、明確な基準はキャリア非公表で個人差がある。"}, {"n": "14", "q": "「切断型予約番号（切断型MNP）」とは？", "a": "予約番号発行と同時に元回線が解約されるタイプのMNP予約番号。通常の予約番号は乗り換えるまで元回線の料金が発生する。"}, {"n": "15", "q": "光回線とセットで契約するメリットは？", "a": "光やAirなどのネット回線を同時契約すると、SIM単体よりCB・ポイントが大きく上乗せされることが多い。"}, {"n": "16", "q": "「おうち割」を組むための条件の一つは？", "a": "SoftBank光の場合は光電話オプション（月額550円〜）が必須。一方SoftBank Air（ホームルーター）は電話オプション不要で本体契約のみでおうち割が組める。"}, {"n": "17", "q": "「空申込」とは？", "a": "実際に開通・利用する予定のない光回線などを、施策条件を満たす目的だけで申し込むこと。リスクの有無は案件・キャリアによる。"}, {"n": "18", "q": "空申込でブラックになることはある？", "a": "維持期間などのルールを守っていれば、空申込自体を理由にブラックになることは基本的にないとされる。"}, {"n": "19", "q": "「同月CB受取り」に関する案件条件でよくある制限は？", "a": "同じ月にすでにCBを受け取っている利用者は、別の施策で二重にCBを受け取れないという制限があることが多い。"}, {"n": "20", "q": "家電量販店のポイント還元は何回でももらえる？", "a": "同じ屋号（同一チェーン）でのポイント還元は基本的に年1回程度が目安。短期間でのおかわりは難しい。"}, {"n": "21", "q": "屋号違いなら量販店ポイントの制限を回避できる？", "a": "同じ屋号での制限を回避する方法として、ヤマダ→ノジマなど別チェーンに変えるという考え方がある。"}, {"n": "22", "q": "家電値引きでもらったポイントはどう現金化する？", "a": "家電量販店のポイントで還元性の高い商品（iPhoneなど）を購入し、買取店で売却して現金化するのが一般的な流れ。"}, {"n": "23", "q": "買取率とは何を表す指標？", "a": "購入金額に対して買取店がいくらで買い取ってくれるかの割合。買取価格÷購入金額で計算する。"}, {"n": "24", "q": "買取率はどのくらいを目安にすればいい？", "a": "85%以上あれば十分、90%以上ならその商品を優先的に選ぶという考え方が講座内で共有されている。"}, {"n": "25", "q": "端末は購入後すぐ売却していい？", "a": "分割払いや一括払いの引き落とし確認、ネットワーク利用制限の解除確認をしてから売却するのが安全とされる。"}, {"n": "26", "q": "開封済みの端末は買取価格が下がる？", "a": "お店によるが、シュリンク（フィルム）を切ると開封扱いになり、未開封より査定が下がる、あるいは買取不可になる場合がある。"}, {"n": "27", "q": "povo（povo2.0）の特徴は？", "a": "月額0円で維持できるプランがあり、維持コストがほぼかからないため、他キャリアの弾や乗り換え後の受け皿としてよく使われる。"}, {"n": "28", "q": "総合ブラックはキャリアをまたいでも共通？", "a": "実例ベースでは、UQで総合NGになってもau本体やpovoは通ったという報告があり、キャリアグループ内でも別々の場合がある（要検証・自己判断）。"}, {"n": "29", "q": "MNPで得たCBや商品券は確定申告の対象になる？", "a": "所得区分や年間の利益額によって申告要否が変わるため、税理士など専門家に相談することが推奨されている。"}, {"n": "30", "q": "初心者が最初にやるべきことは？", "a": "自分と家族が現在契約しているキャリア・光回線・年齢構成を洗い出し、教材のキャリアルールを確認したうえで、まずは自分自身のMNPから小さく実践するのが基本の流れ。"}], "中級": [{"n": "31", "q": "UQで複数回線を家族名義で契約する際の注意点は？", "a": "契約するUQ（または代理店）のCBに関する決まりごと（同一屋号1回線1利用者など）を事前に確認する必要がある。UQ・ドコモでは比較的縛りが緩いという報告が多い。"}, {"n": "32", "q": "妻がすでに他社でCBを受け取っている場合、自分名義でMNPは可能？", "a": "既存回線が妻名義の1回線だけであれば契約自体は可能なことが多いが、2回線目以降のCB付与可否は案件・店舗次第で保証されない。"}, {"n": "33", "q": "案件詳細に「当月CB履歴ある場合は不可」とある場合の意味は？", "a": "その月にすでにCBを受け取った利用者は同月内は対象外になるという意味。同月に受け取っていない別の利用者を登録すればCB対象になり得る。"}, {"n": "34", "q": "ドコモの委任状契約で代理人ができる範囲は？", "a": "家族関係証明書類（戸籍謄本など）と本人確認書類原本があれば、ドコモは委任状で家族の契約手続きが可能（案件によらずドコモ全般のルール）。"}, {"n": "35", "q": "住民票だけで利用者登録の本人確認はできる？", "a": "原則、住民票単独では本人確認書類として使用できず、運転免許証やマイナンバーカードなど別途の身分証が必要。ただし例外としてソフトバンク・ワイモバイルの利用者登録における家族確認書類としては、住民票単体でも受付可能なケースがある。"}, {"n": "36", "q": "戸籍謄本を使った家族確認で認められる書類の考え方は？", "a": "戸籍謄本・戸籍抄本など名称は複数あるが、生きている家族間の血縁関係が確認できる書類であれば基本的に問題ない。ただし「除籍謄本」（亡くなった方の書類）は利用者登録には使えないため除外する。"}, {"n": "37", "q": "JCOMモバイルを弾に使うのはおすすめできる？", "a": "短期解約でブラックになるリスクがあるため、速射（短期間で連続的にMNPする）向きではないとされる。"}, {"n": "38", "q": "LINEMOを速射（短期解約前提）の弾にするリスクは？", "a": "LINEMOはSB・YM系と同じ括りとされ、短期解約はソフトバンク/ワイモバイル側のブラックリスクにつながるため推奨されていない。"}, {"n": "39", "q": "マイそくのプランで事務手数料無料の対象になるのは？", "a": "「マイそくライト」は対象になるが「マイそくスーパーライト」は事務手数料無料の対象外という情報が共有されている（時期により変わる可能性あり）。"}, {"n": "40", "q": "ソフトバンクAirの「安心乗り換えキャンペーン」が使えない典型的なケースは？", "a": "既存でソフトバンク光やAirを契約している場合、解約後3ヶ月空けないと安心乗り換えキャンペーンが適用できない。"}, {"n": "41", "q": "既存のソフトバンク光がある状態で家族名義でAirの補填を使う裏ワザ的な考え方は？", "a": "別住所（実家など）の家族名義でAirを契約すれば、既存契約者本人とは別扱いになり補填やおうち割が使える可能性がある（自己責任）。"}, {"n": "42", "q": "auショップで案内される預託金は必ずブラックのサインか？", "a": "預託金はブラックとは無関係で、同一世帯・短期間での契約集中など審査要因により求められるケースがあるとされている。"}, {"n": "43", "q": "YS（量販店）案件の同一住所回線数の縛りを回避する方法として共有された裏技は？", "a": "マイページで既存回線の契約住所を一時的に実家など別住所に変更すると、自宅住所の契約回線数が減り、新たな契約が通りやすくなる（自己責任）。"}, {"n": "44", "q": "イオンモバイル・ゲオモバイルの維持期間は量販店と同じ91日でよい？", "a": "ゲオモバイルはUQ回線をベースにしているため91日で十分とされる一方、イオンモバイルは91日でもブラックになる時はなるとされ、明確な安全基準はない。"}, {"n": "45", "q": "イオンモバイルを弾に使うメリットは薄いとされる理由は？", "a": "91日維持すると赤字になりやすく、即乗り換えはブラックリスクが高いため、同条件ならポケットSIMを弾に使うほうがコスト面で有利とされる。"}, {"n": "46", "q": "au系での支払い実績「2回」とはどのタイミングを指す？", "a": "クレジットカードの引き落とし（支払い完了）が2回成立した時点を指すという解釈が共有されている。クレカの締め日・引き落とし日により実際の期間は変動する。"}, {"n": "47", "q": "UQ→povoへの契約変更で事務手数料はかかる？", "a": "UQからpovoへの契約変更は事務手数料がかからないという報告がある。"}, {"n": "48", "q": "紹介キャンペーンのポイントを確実に受け取るための立ち回りは？", "a": "特典が付与されるまでは契約したキャリア（例：UQ）のまま維持し、付与確認後にpovoなど別プランへ移行するのが安全とされる。"}, {"n": "49", "q": "ワイモバイルのシェアプランを使うメリットは？", "a": "増量オプションより安価に家族間でギガをシェアできる（例：月539円のオプションでギガシェア）。"}, {"n": "50", "q": "家電量販店でSIM単体と光回線同時契約でポイントの上乗せ構造に違いはある？", "a": "店舗・キャリアによって「SIM単体が優遇される店」と「光回線契約で増額される店」があり、店舗ごとの傾向を確認する必要がある。"}, {"n": "51", "q": "ワイモバイルのおうち割PayPay還元だけ欲しく月額の割引は不要な場合の解約タイミングは？", "a": "①PayPay申請が完了した時点で解約、②より確実にしたい場合はPayPay受取（チャージ完了）後に解約、の2パターンが考えられる。"}, {"n": "52", "q": "同日に複数店舗で契約すればワイモバイルの公式PayPay還元は4回線分適用される？", "a": "店舗と公式PayPay施策は別物という整理があり、店舗を分けても契約日をずらさないと4回線分適用されないと案内されるケースがある。実際の運用は要問い合わせ。"}, {"n": "53", "q": "ソフトバンク光からドコモ光などへの「解約→再契約でCB狙い」は可能？", "a": "可能ではあるが、短期解約はNGとなることがあり、同一販路（同じ代理店経由など）だとCBが出ない場合もある。"}, {"n": "54", "q": "法人MNPで個人と異なる注意点は？", "a": "ドコモの1年内解約手数料（1,100円）は法人の場合かからない、預託金の照会方法が個人と異なるなど、個人契約とは別ルールが存在する。"}, {"n": "55", "q": "預託金を個人口座で受け取る際の注意点は？", "a": "ショップからビジネスコンタクトセンターなどへの照会が必要になる場合があり、休日は対応窓口が休みで、法人名義口座が必須になったケースが報告されている。"}, {"n": "56", "q": "大量回線契約時に預託金額を抑える工夫として共有された方法は？", "a": "一度に大量契約するのではなく、10回線ずつなど区切って契約することで、1回線あたりの預託金額が下がる可能性があるという報告がある（再現性は不明）。"}, {"n": "57", "q": "家族の光回線契約状況を代理店に伝える際に必要なものは？", "a": "契約者本人の来店や必要書類の提示が求められる場合があるため、事前に代理店へ確認するのが望ましい。"}, {"n": "58", "q": "主要キャリアの自宅セット割が適用される契約種別の共通点は？", "a": "光（+電話 or +TV）、ホームルーター／モバイルルーター、でんき、のいずれかを契約していることが条件になる場合が多く、ネット単体契約のみでは適用外というケースがある。"}, {"n": "59", "q": "光回線のCBを二重取りすることはできる？", "a": "同じ回線・同じ施策で量販店から先にCBを受け取っている場合、別施策との二重取りは基本的にできない。"}, {"n": "60", "q": "案件を選ぶ前に利益計算シートで確認すべきことは？", "a": "自分・家族の現状の毎月の通信費、契約可能な人数・回線数、各案件でのCB額を入力し、実践した場合の手残り額を事前に把握すること。"}], "マニアック": [{"n": "61", "q": "UQで妻が既にMNPでCBを受け取っている場合、自分の名義違いで3回線同時契約は通る？", "a": "既存UQ回線が妻の1回線のみであれば契約自体はルール上可能だが、2回線目以降にCBが付与されるかは店舗のアラート次第で不確実、との見解が共有されている。"}, {"n": "62", "q": "auショップ案件で「同月CB履歴があると不可」の場合の抜け道は？", "a": "同月にCBを受け取っていない別の利用者を新たに登録すれば、その回線ではCBの対象になり得るという運用が共有されている。"}, {"n": "63", "q": "「アテナ案件015」でのUQ契約パターン（本人名義3回線・うち1回線利用者登録）で通る条件は？", "a": "解約新規（同月内の解約→新規）ではないこと、当月中にCBを受け取った利用者を含まないこと、の2点を満たせば通るとされる。"}, {"n": "64", "q": "ワイモバイルオンラインショップで審査に落ち続けている場合、真っ先に疑うべき原因は？", "a": "直近で181日以上維持した回線を解約したことによるワイモバイル側の総合ブラックの可能性。SIM単体の新規申込が「見合わせ」メールで返ってくるのが典型的な兆候。"}, {"n": "65", "q": "戸籍謄本による本人確認で、家電量販店でも予約番号を使った親・兄弟の代理契約はできる？", "a": "「統一審査基準」という店舗を問わないルールがあり、本来は問題ないとされるが、店舗独自ルールで断られる可能性はある。"}, {"n": "66", "q": "アテナ案件059の「光でんきの空申込」はブラックリスクがある？", "a": "維持期間などのルールを守っていれば、空申込自体を理由にしたブラックは基本的にないとされる。"}, {"n": "67", "q": "法人ドコモ案件で、代表者が個人でドコモ回線を持っていても実施できる？", "a": "ケースバイケースとされ、法人契約と個人契約は原則別枠として扱われることが多いが、確実な判断には最新の案件詳細・店舗確認が必要。"}, {"n": "68", "q": "ワイモバ紹介キャンペーンでPayPayアプリに1アカウントあたりチャージできるコード数の目安は？", "a": "正式な上限は「1アカウントにつき月4回（4コード）まで」。おうち割の10コードと混同しやすいが別物で、5コード目以降のエラーはこの月4回上限が原因。回避するには別のPayPayアカウントへチャージする。"}, {"n": "69", "q": "ヤマダ電機の交渉で施策が段階的に上がっていく実例のポイントは？", "a": "積極的に多くを話さず反応を待つ（店員が自主的に上司へ相談を重ねる）ことで、現金5,000円→WiMAX付き2万pt→家電値引き2.2万→3.3万円（当月中購入）まで上がった実例が報告されている。"}, {"n": "70", "q": "家電量販店でのポイント付与は「即日」か「翌日」かで何が変わる？", "a": "即日付与が基本だが、店員から「1年維持しないとポイントが無くなる」等と案内されるケースがあり、実際の運用や条件表示との整合性を確認する必要がある。"}, {"n": "71", "q": "同じ屋号での量販店ポイント制限に対する回避策は？", "a": "ヤマダ→ノジマなど、系列の異なる別チェーンに変えることで、1年に1回という制限を回避できるとされている。"}, {"n": "72", "q": "ワイモバイルオンラインショップでの新規申込時、直近解約回線から何日空ければ審査に通るとされているか（実例）？", "a": "実例では2回線解約から5日ほどでは同じ「見合わせ」の返信が続いたため、単純な日数経過だけでは総合ブラックは解消しないと考えられる。"}, {"n": "73", "q": "auの統一審査基準とはどのようなルールか？", "a": "店舗ごとの個別ルールとは別に、店舗を問わない全社共通の審査基準が存在し、本来はこれに沿えば戸籍謄本等での代理契約も問題ないとされる。"}, {"n": "74", "q": "ワイモバイルの利用者は1人あたり何回線まで登録できる？", "a": "ワイモバイルの使用者登録は一人につき2回線までというルールが共有されている。"}, {"n": "75", "q": "ソフトバンク光からGMOへの乗り換え（Wi-Fiを使ったMNPとの錬金術）で、SB Airの安心乗り換えキャンペーンの受給条件は？", "a": "契約成立から90日以内の申請、かつ課金開始月を1ヶ月目として6ヶ月目末日までの維持が基本条件とされ、実質SB Airを6ヶ月維持しないと受け取れないとされる。"}, {"n": "76", "q": "ソフトバンクAirを解約してからドコモ光やBIGLOBE光などへ「補填」を使う場合の注意点は？", "a": "補填を使う前提でAirを契約したにもかかわらず解約してしまうと、既存ネット契約の有無ヒアリング不足による「約束不履行」扱いになるリスクがあるため、事前に既存ネット環境の有無を必ず確認する必要がある。"}, {"n": "77", "q": "「ドコモのホームルーターからAirへ乗り換え」で安心乗り換えキャンペーンが対象外になった場合、次に検討すべきことは？", "a": "家電値引きは別途受けられる場合があるため、そのまま契約を進めつつ、補填が使えない分は別施策（他社光のCBなど）でカバーする立ち回りが提案されている。"}, {"n": "78", "q": "UQオンラインで端末MNP2回線が審査落ちした場合に考えられる原因は？", "a": "直前月の支払い実績が2回分満たされていない、あるいは短期解約・大量契約による無限ループ的な審査制限（いわゆる「支払い実績不足」）が疑われるとされる。"}, {"n": "79", "q": "au系クレジットカードの支払い実績「2回」の起算日の考え方は？", "a": "例えば8月10日引き落とし・9月10日引き落としの2回が正しく完了した時点で実績が成立し、それ以降に新規契約が可能になるという解釈が共有されている（カード会社の締め日で変動）。"}, {"n": "80", "q": "UQ紹介キャンペーンをすでにpovoへ移行してしまった場合、特典は必ず対象外になる？", "a": "必ず対象外とは言い切れないが、特典が付与されない可能性があるため、確実に受け取りたいならUQのまま維持しておくのが安全とされる。"}, {"n": "81", "q": "povo移行後に紹介キャンペーンのau PAYが消滅するリスクを下げる立ち回りは？", "a": "現金CBなど別施策をすでに受領済みであれば、紹介キャンペーンのポイントだけが消える可能性は比較的低いとされ、付与時期まで様子を見るのが妥当とされている。"}, {"n": "82", "q": "UQモバイルの現在の維持期間の「正式な日数」は明言されている？", "a": "明確な日数は公表されておらず、維持してもブラックになる／ならないは人によるとされ、目安として語られるのみである。"}, {"n": "83", "q": "UQ総合NGから復活を狙う場合、どのくらいの頻度で審査（ダメ元契約）を試すのが妥当とされる？", "a": "普通は1年後を目安にするという意見がある一方、毎月ダメ元で通い4ヶ月でブラック解除できた実例も報告されており、個人差が大きい。"}, {"n": "84", "q": "UQのイベントスタッフが「180日経ってなくてもYモバイルはブラックの可能性がない」と発言した場合、鵜呑みにしていい？", "a": "現場スタッフの発言は不確実であり信用しないほうがよいとされ、実際にワイモバイルで短期解約後ブラックになった報告例もある。"}, {"n": "85", "q": "17歳の未成年が単独でポケットSIMを速射契約できない場合の代替策は？", "a": "ポケットSIMを親名義で契約したうえで、MNPするキャリア側の契約に親が同席すれば、子ども名義での契約は問題なく進められるとされる（12歳以上から契約可能、ただし弾は格安キャリアでは名義クロスが必要になる場合がある）。"}, {"n": "86", "q": "移転元回線の名義と移転先の契約名義が異なる場合にMNP作業でつまずいた実例の解決策は？", "a": "「移転元は自分名義、移転先は子ども名義でMNPしたい」と最初に明確に伝えることで手続きがスムーズに進む。ドコモは委任状契約が可能なため家族本人の来店が不要なケースもある。"}, {"n": "87", "q": "LINEMOがブラックになった場合、ワイモバイルにも影響は共有される？", "a": "断定的な回答は確認できておらず、講座内でも明確な結論には至っていない未解決の質問として残っている（自己責任での判断が必要）。"}, {"n": "88", "q": "ドコモ回線の二重乗り換え（docomo5G→SBAir→GMO）のような多段階の置き換えプランを組む際に補填確認後に行う手順は？", "a": "SBAirを約6ヶ月維持して補填金を確認した後にGMOを契約しSBAirを解約、GMOはさらに約1年維持してから解約する、という段階的な乗り換え計画が共有されている。"}, {"n": "89", "q": "YM系の同一住所での契約回線数の上限は？", "a": "同一住所で最大5回線という運用が共有されている。"}, {"n": "90", "q": "家族名義クロスでMNPする際に必要な準備物として共有されているものは？", "a": "委任状のテンプレート（初心者向けマニュアルとあわせて講座内で配布）を使用する。"}, {"n": "91", "q": "履歴確認の厳格化（来月から強化）の噂に対して実践者が取った対応の実例は？", "a": "厳格化前に駆け込みで契約を進める動きがあり、既存の電気・ネット契約を活かして高額CB（現金9万円など）を得た実例が報告されている。"}, {"n": "92", "q": "UQ→povoへ切り替えた直後にオンラインでの端末MNP申込が通らなかった場合、真っ先に疑うべき点は？", "a": "2ヶ月分の支払い実績が満たされていない可能性が高いとされ、開通確認の遅延などで手続きが翌月にずれ込んだことが原因になり得る。"}, {"n": "93", "q": "即povo（契約後すぐpovoに切り替え）した回線を弾に使うとUQでブラックになるケースがあるのはなぜ？", "a": "povoを一定期間（目安90日など）維持せずに弾として利用すると、UQ側でブラック判定を受けるケースが報告されている。安全策としてはトッピングなどをして半年〜1年程度維持することが挙げられる。"}, {"n": "94", "q": "UQ→povoへの契約変更で1年間の契約数が5回線を超えても事務手数料はかからない？", "a": "明確な回答は確認できておらず、代理店によって案内が異なる可能性があるため個別に確認が必要な未解決論点として扱われている。"}, {"n": "95", "q": "家電量販店のドコモ回線でSIM3本契約すると光回線の増額幅はどう変わる？", "a": "実例ではSIM3本＋docomoで光回線が10万円まで増額された一方、SIMのみだと2万円にとどまるなど、SIM本数とセット契約内容で増額幅が大きく変動する。"}, {"n": "96", "q": "ジョーシンやエディオンなど、ヤマダと逆の増額傾向を持つ店舗の特徴は？", "a": "ヤマダは光回線側が増額されやすいのに対し、ジョーシン・エディオンなど他社量販店はSIM単体側に増額が付きやすい傾向がある、という実践報告がある。"}, {"n": "97", "q": "ドコモの審査基準変更（解約日から1年経過していないと再契約不可）についての実例は？", "a": "2026年1月に契約→3ヶ月後解約→同年8月に6回線再契約できた実例が報告される一方、翌月以降は解約日を厳格に見られるようになるとの情報もあり、施行時期・店舗差が大きい。"}, {"n": "98", "q": "手配師との連絡が途絶えた場合の一般的な対応として共有されている考え方は？", "a": "催促のLINEを送ると自動応答システムの都合で対応順が後回しになる可能性があるため、体調不良などでワンオペ対応している手配師に対しては催促せず待つのが得策、という体験談がある。"}, {"n": "99", "q": "手配料を支払った案件で連絡が取れず契約日程も未定な場合、返金を求めるのは一般的にアリ？", "a": "事前連絡なく既読すらつかず具体的な案内もない状況が続く場合は、返金を求めるのは一般的に問題ないという見解が共有されている。"}, {"n": "100", "q": "手配師の公式LINEが突然消えた（アカウント停止等）場合の追跡方法は？", "a": "X（旧Twitter）のDMやプロフィール欄のリンク更新を確認する、事前にヒアリングシートを送っていればSMSで新しい連絡先が届いていないか確認する、といった方法が実例として共有されている。"}]};
const ORDER = ["初級","中級","マニアック"];
let current = ORDER[0];

const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');

function chevronSVG(){
  return '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
}

function renderTabs(){
  tabsEl.innerHTML = '';
  ORDER.forEach(label => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (label === current ? ' active' : '');
    btn.innerHTML = label + '<span class="count">' + DATA[label].length + '問</span>';
    btn.addEventListener('click', () => { current = label; renderTabs(); renderList(); });
    tabsEl.appendChild(btn);
  });
}

function renderList(){
  listEl.innerHTML = '';
  DATA[current].forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML =
      '<div class="q-row">' +
        '<div class="q-num">' + item.n + '</div>' +
        '<div class="q-text">' + item.q + '</div>' +
        chevronSVG() +
      '</div>' +
      '<div class="a-wrap"><div class="a-inner"><span class="a-label">A</span><br>' + item.a + '</div></div>';

    const row = el.querySelector('.q-row');
    const wrap = el.querySelector('.a-wrap');
    row.addEventListener('click', () => {
      const isOpen = el.classList.contains('open');
      if(isOpen){
        wrap.style.maxHeight = wrap.scrollHeight + 'px';
        requestAnimationFrame(() => { wrap.style.maxHeight = '0px'; });
        el.classList.remove('open');
      } else {
        el.classList.add('open');
        wrap.style.maxHeight = wrap.scrollHeight + 'px';
      }
    });
    wrap.addEventListener('transitionend', () => {
      if(el.classList.contains('open')) wrap.style.maxHeight = 'none';
    });

    listEl.appendChild(el);
  });
}

renderTabs();
renderList();
</script>
